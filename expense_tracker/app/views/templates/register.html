<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>註冊 · 記帳本</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/globals.css">
  <link rel="stylesheet" href="/static/css/auth.css">
</head>
<body>
  <div class="auth-card">
    <h2>註冊新帳號</h2>
    <div id="error-msg" class="error-msg" style="display:none"></div>
    <div class="field"><label>帳號名稱</label><input type="text" id="username" /></div>
    <div class="field"><label>設定密碼</label><input type="password" id="password" /></div>
    <button class="btn" onclick="doRegister()">建立帳號</button>
    <a href="/login" class="link">已經有帳號？返回登入</a>
  </div>
  <style>
    .error-msg {
      background: rgba(255, 95, 95, 0.12);
      border: 1px solid var(--danger);
      color: var(--danger);
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 1.4rem;
      margin-bottom: 16px;
    }
  </style>
  <script>
    async function doRegister() {
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const res = await fetch('/register', { method: 'POST', body: JSON.stringify({username, password})});
      const data = await res.json();
      if (res.ok) {
        location.href = '/';
      } else {
        const el = document.getElementById('error-msg');
        el.textContent = data.error;
        el.style.display = 'block';
      }
    }
  </script>
</body>
</html>
