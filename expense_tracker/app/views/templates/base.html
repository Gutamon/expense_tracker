<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>{% block title %}記帳本{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/globals.css') }}">
  <style>
    body {
      font-size: 1rem;
    }

    header {
      border-bottom: 1px solid var(--border);
      padding: 1.25rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: .04rem;
    }

    .logo span {
      color: var(--accent);
    }

    nav {
      display: flex;
      align-items: center;
    }

    nav a {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.85rem;
      margin-left: 1.5rem;
      transition: color .2s;
    }

    nav a:hover,
    nav a.active {
      color: var(--accent);
    }

    .shell {
      max-width: 960px;
      margin: 0 auto;
      padding: 2.5rem 1.5rem;
    }

    /* RWD Header */
    @media (max-width: 768px) {
      header {
        flex-direction: column;
        align-items: flex-start;
        padding: 1rem;
        gap: 1rem;
      }
      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
      }
      nav a {
        margin-left: 0;
      }
      nav span.separator {
        display: none;
      }
      .shell {
        padding: 1.25rem 1rem;
      }
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  {% block header %}
  <header>
    <div class="logo">帳 <span>·</span> 本</div>
    <nav>
      <a href="/" class="{% if request.path == '/' %}active{% endif %}">記帳專區</a>
      <a href="/charts" class="{% if request.path == '/charts' %}active{% endif %}">圖表分析</a>
      <a href="/settings" class="{% if request.path == '/settings' %}active{% endif %}">設定管理</a>
      <a href="/stocks" class="{% if request.path == '/stocks' %}active{% endif %}">股票專區</a>
      <span class="separator" style="color:var(--muted); margin-left:1.5rem;">|</span>
      <span class="separator user-name" style="color:var(--text); margin-left:1.5rem;">{{ username }}</span>
      <a href="/logout">登出</a>
    </nav>
  </header>
  {% endblock %}

  <main class="shell">
    {% block content %}{% endblock %}
  </main>

  {% block scripts %}{% endblock %}
</body>
</html>
