<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>{% block title %}記帳本{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cactus+Classical+Serif&family=Figtree:wght@400;500;600;700;800&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/globals.css') }}">
  <script src="{{ url_for('static', filename='js/custom_select.js') }}" defer></script>
  <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
  <link rel="icon" type="image/png" sizes="192x192" href="{{ url_for('static', filename='icon-192.png') }}">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="帳本">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#17181a">
  {% set embed = request.args.get('embed') %}
  <style>
    body { font-size: 1rem; }

    /* ── Top header ── */
    header {
      border-bottom: 1px solid var(--border);
      padding: 1.25rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo { font-size: 1.1rem; font-weight: 700; letter-spacing: .04rem; }
    .logo span { color: var(--accent); }
    nav.top-nav { display: flex; align-items: center; }
    nav.top-nav a {
      color: var(--muted); text-decoration: none; font-size: 0.85rem;
      margin-left: 1.5rem; transition: color .2s;
    }
    nav.top-nav a:hover, nav.top-nav a.active { color: var(--accent); }

    .shell { max-width: 960px; margin: 0 auto; padding: 2.5rem 1.5rem; }

    {% if embed %}
    /* ── Embed mode: no nav chrome ── */
    header, .bottom-nav { display: none !important; }
    .shell { padding: 1.5rem 1rem; }
    @media (max-width: 768px) {
      .shell { padding-bottom: calc(64px + 16px + env(safe-area-inset-bottom) + 1.25rem); }
    }
    {% else %}
    /* ── Normal mode: bottom nav on mobile ── */
    .bottom-nav {
      display: none;
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 40;
      padding: 0 16px calc(12px + env(safe-area-inset-bottom)) 16px;
      pointer-events: none;
    }
    .bottom-nav__inner {
      pointer-events: all;
      display: flex; align-items: stretch; width: 100%;
      background: rgba(18, 18, 22, 0.72);
      backdrop-filter: blur(20px) saturate(160%);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px; height: 64px; overflow: hidden;
      box-shadow: 0 4px 32px rgba(0, 0, 0, 0.50), inset 0 1px 0 rgba(255, 255, 255, 0.05);
    }
    .bottom-nav__item {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 4px; text-decoration: none; color: var(--muted);
      font-size: 0.6rem; letter-spacing: 0.04em;
      transition: color .18s; -webkit-tap-highlight-color: transparent; min-width: 0;
    }
    .bottom-nav__item svg {
      width: 20px; height: 20px; flex-shrink: 0; fill: none;
      stroke: currentColor; stroke-width: 1.8;
      stroke-linecap: round; stroke-linejoin: round;
    }
    .bottom-nav__item span { display: block; white-space: nowrap; }
    .bottom-nav__item.active { color: var(--accent); }
    .bottom-nav__item.active svg { stroke: var(--accent); }

    @media (max-width: 768px) {
      header { display: none; }
      .bottom-nav { display: block; }
      .shell {
        padding: 1.25rem 1rem;
        padding-bottom: calc(64px + 12px + env(safe-area-inset-bottom) + 1.25rem);
      }
    }
    @media (min-width: 769px) {
      header { display: flex; }
      .bottom-nav { display: none; }
      .shell { padding: 2.5rem 1.5rem; }
    }
    {% endif %}
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  {% if not embed %}
  {% block header %}
  <header>
    <div class="logo">帳 <span>·</span> 本</div>
    <nav class="top-nav">
      <a href="/settings" class="{% if request.path == '/settings' %}active{% endif %}">設定管理</a>
      <a href="/charts" class="{% if request.path == '/charts' %}active{% endif %}">圖表分析</a>
      <a href="/home" class="{% if request.path == '/home' %}active{% endif %}">記帳專區</a>
      <a href="/debts" class="{% if request.path == '/debts' %}active{% endif %}">負債管理</a>
      <a href="/stocks" class="{% if request.path == '/stocks' %}active{% endif %}">股票專區</a>
    </nav>
  </header>
  {% endblock %}
  {% endif %}

  <main class="shell">
    {% block content %}{% endblock %}
  </main>

  {% if not embed %}
  <!-- Bottom nav (mobile, non-embed only) -->
  <nav class="bottom-nav" aria-label="主選單">
    <div class="bottom-nav__inner">
      <a href="/settings" class="bottom-nav__item {% if request.path == '/settings' %}active{% endif %}">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span>設定</span>
      </a>
      <a href="/charts" class="bottom-nav__item {% if request.path == '/charts' %}active{% endif %}">
        <svg viewBox="0 0 24 24"><rect x="3" y="12" width="4" height="9" rx="1"/><rect x="10" y="7" width="4" height="14" rx="1"/><rect x="17" y="3" width="4" height="18" rx="1"/></svg>
        <span>圖表</span>
      </a>
      <a href="/home" class="bottom-nav__item {% if request.path == '/home' %}active{% endif %}">
        <svg viewBox="0 0 24 24"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V9.5z"/><path d="M9 21V12h6v9"/></svg>
        <span>記帳</span>
      </a>
      <a href="/debts" class="bottom-nav__item {% if request.path == '/debts' %}active{% endif %}">
        <svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="13" rx="2"/><path d="M2 10h20"/><path d="M6 15h4"/></svg>
        <span>負債</span>
      </a>
      <a href="/stocks" class="bottom-nav__item {% if request.path == '/stocks' %}active{% endif %}">
        <svg viewBox="0 0 24 24"><polyline points="3 17 8 12 13 15 21 7"/><polyline points="16 7 21 7 21 12"/></svg>
        <span>股票</span>
      </a>
    </div>
  </nav>
  {% endif %}

  <script>
    // Register the PWA service worker (installability + offline app shell).
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('/sw.js').catch(function() {});
      });
      // Any code change gives sw.js new bytes, so the browser installs a new worker.
      // This fires once when it takes over — reload so the page isn't left stale.
      var _swReloaded = false;
      navigator.serviceWorker.addEventListener('controllerchange', function() {
        if (_swReloaded) return;
        _swReloaded = true;
        window.location.reload();
      });
    }

    // Bfcache restore (mobile back-swipe / app-switcher resume) re-shows the DOM
    // exactly as it was, bypassing any network request — so after an export/wipe
    // or import, the old page's data reappears until a manual reload. Force a
    // real reload whenever the page comes back from bfcache.
    window.addEventListener('pageshow', function(e) {
      if (e.persisted) window.location.reload();
    });

    // Chrome Android ignores user-scalable=no; block pinch-zoom and double-tap zoom via JS
    document.addEventListener('touchmove', function(e) {
      if (e.touches.length > 1) e.preventDefault();
    }, { passive: false });
    // Double-tap zoom guard. preventDefault() on the 2nd rapid tap stops the zoom
    // gesture — but it also cancels the synthesized click, which broke rapid
    // consecutive taps on the ‹ › month/pager arrows (tap N times, only some
    // registered). For opted-in controls (.tap-repeat) we re-dispatch the click
    // ourselves so每一下都生效，同時仍保留 zoom 鎖。
    var lastTap = 0;
    document.addEventListener('touchend', function(e) {
      var now = Date.now();
      if (now - lastTap < 300) {
        e.preventDefault();
        var btn = e.target.closest && e.target.closest('.tap-repeat');
        if (btn && !btn.disabled) btn.click();
      }
      lastTap = now;
    }, { passive: false });

    // Disable browser autofill history on all text/number/date inputs globally
    document.addEventListener('DOMContentLoaded', function() {
      document.querySelectorAll('input[type="text"],input[type="number"],input[type="date"],input[type="search"]').forEach(function(el) {
        el.setAttribute('autocomplete', 'off');
      });
    });

    // NavState: simple sessionStorage wrapper for sub-tab persistence across CRUD reloads
    window.NavState = {
      _k: function(ns, key) { return 'navstate_' + ns + '_' + key; },
      get: function(ns, key, def) {
        try { var v = sessionStorage.getItem(this._k(ns, key)); return v !== null ? JSON.parse(v) : def; } catch(e) { return def; }
      },
      set: function(ns, key, val) {
        try { sessionStorage.setItem(this._k(ns, key), JSON.stringify(val)); } catch(e) {}
      }
    };
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
