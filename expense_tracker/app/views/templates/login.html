<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <title>登入 · 記帳本</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/globals.css">
  <link rel="stylesheet" href="/static/css/auth.css">
</head>

<body>
  <div class="auth-card">
    <h2>登入帳號</h2>
    <div class="field"><label>帳號</label><input type="text" id="username" /></div>
    <div class="field"><label>密碼</label><input type="password" id="password" /></div>
    <button class="btn" onclick="doLogin()">登入</button>
    <a href="/register" class="link">還沒有帳號？前往註冊</a>
  </div>
  <script>
    async function doLogin() {
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const res = await fetch('/login', { method: 'POST', body: JSON.stringify({ username, password }) });
      const data = await res.json();
      if (res.ok) location.href = '/';
      else alert(data.error);
    }
  </script>
</body>

</html>
