{% extends "base.html" %}

{% block title %}圖表分析 · 記帳本{% endblock %}

{% block head %}
<script src="{{ url_for('static', filename='vendor/chartjs/chart.umd.min.js') }}"></script>
<style>
  /* ── Attribute filter dropdowns ── */
  .filter-bar {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }

  .mfilter-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: inherit;
    font-size: .85rem;
    cursor: pointer;
    padding: 6px 12px;
    border-radius: 8px;
    transition: all .2s;
  }

  .mfilter-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .mfilter-btn.filtered {
    background: var(--accent-dim);
    border-color: var(--accent);
    color: var(--accent);
  }

  .mfilter-menu {
    display: none;
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    z-index: 30;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 6px;
    min-width: 200px;
    max-height: 300px;
    overflow-y: auto;
    box-shadow: 0 4px 12px rgba(0, 0, 0, .35);
  }

  .mfilter.open .mfilter-menu {
    display: block;
  }

  .mfilter-sep {
    height: 1px;
    background: var(--border);
    margin: 4px 6px;
  }

  .mfilter-type-label {
    font-size: .72rem;
    font-weight: 600;
    letter-spacing: .08em;
    padding: 8px 10px 4px;
  }

  .mfilter-type-label.expense {
    color: var(--danger);
  }

  .mfilter-type-label.income {
    color: var(--positive);
  }

  /* ── Time mode & window nav ── */
  .time-filter-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }

  .time-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: inherit;
    font-size: .82rem;
    cursor: pointer;
    padding: 5px 12px;
    border-radius: 6px;
    transition: all .2s;
  }

  .time-btn.active {
    border-color: var(--accent);
    color: var(--accent);
  }

  .win-nav {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-left: auto;
  }

  .win-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 6px;
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 0;
    transition: all .2s;
  }

  .win-btn:hover:not(:disabled) {
    border-color: var(--accent);
    color: var(--accent);
  }

  .win-btn:disabled {
    opacity: .35;
    cursor: default;
  }

  .win-btn svg {
    width: 14px;
    height: 14px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .win-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: .8rem;
    color: var(--muted);
    min-width: 130px;
    text-align: center;
  }

  /* ── Cards ── */
  .charts-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 24px;
  }

  .card {
    overflow: hidden;
    min-width: 0;
  }

  .card-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }

  .card-head h2 {
    font-size: .8rem;
    font-weight: 500;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0;
  }

  .card-head .scope {
    font-family: 'JetBrains Mono', monospace;
    font-size: .75rem;
    color: var(--muted);
  }

  .swipe-area {
    touch-action: pan-y;
  }

  canvas {
    max-height: 320px;
    max-width: 100%;
    display: block;
  }

  /* ── Ranking (主要收/支組成) ── */
  .rank-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 28px;
  }

  .rank-grid.two-col {
    grid-template-columns: 1fr 1fr;
  }

  .rank-section-title {
    font-size: .85rem;
    font-weight: 500;
    margin-bottom: 16px;
  }

  .rank-section-title.income {
    color: var(--positive);
  }

  .rank-section-title.expense {
    color: var(--danger);
  }

  .rank-group {
    margin-bottom: 18px;
  }

  .rank-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    font-size: .85rem;
  }

  .rank-name {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .rank-val {
    font-family: 'JetBrains Mono', monospace;
    font-size: .82rem;
    font-variant-numeric: tabular-nums;
    flex-shrink: 0;
    display: flex;
    align-items: baseline;
  }

  .rank-val .amt-sign {
    display: inline-block;
    width: 32px;
    color: var(--muted);
  }

  .rank-val .amt-digits {
    text-align: right;
  }

  .rank-val .pct {
    color: var(--muted);
    font-size: .75rem;
    margin-left: 6px;
  }

  .rank-track {
    height: 6px;
    background: rgba(255, 255, 255, .06);
    border-radius: 4px;
    margin: 8px 0 6px;
    overflow: hidden;
  }

  .rank-fill {
    height: 100%;
    border-radius: 4px;
    min-width: 2px;
  }

  .rank-cats {
    padding-left: 16px;
  }

  .rank-cat {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    font-size: .78rem;
    color: var(--muted);
    padding: 3px 0;
  }

  .rank-cat .amt {
    font-family: 'JetBrains Mono', monospace;
    font-variant-numeric: tabular-nums;
    flex-shrink: 0;
    display: flex;
    align-items: baseline;
    min-width: 84px;
  }

  .rank-cat .amt .amt-sign {
    display: inline-block;
    width: 28px;
    color: var(--muted);
  }

  .rank-cat .amt .amt-digits {
    flex: 1;
    text-align: right;
  }

  .rank-cat.rank-more {
    cursor: pointer;
    user-select: none;
    transition: color .15s;
  }

  .rank-cat.rank-more:hover {
    color: var(--text);
  }

  .rank-cat.rank-more .chev {
    display: inline-block;
    width: 12px;
    font-size: .7rem;
  }

  .rank-rest .rank-cat {
    padding-left: 4px;
  }

  .rank-empty {
    font-size: .85rem;
    color: var(--muted);
    padding: 12px 0;
  }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    display: inline-block;
    flex-shrink: 0;
  }

  @media (max-width: 768px) {
    .rank-grid.two-col {
      grid-template-columns: 1fr;
    }

    .win-nav {
      margin-left: 0;
      width: 100%;
      justify-content: center;
    }
  }
</style>
{% endblock %}

{% block content %}
<div class="page-tabs">
  <button class="page-tab" data-tab="balance" onclick="switchTab('balance')">收支</button>
  <button class="page-tab" data-tab="expense" onclick="switchTab('expense')">支出</button>
  <button class="page-tab" data-tab="income" onclick="switchTab('income')">收入</button>
</div>

<!-- 篩選：每個屬性一顆按鈕，展開可複選的選單 -->
<div class="filter-bar" id="filter-bar">
  <div class="mfilter" data-kind="acc">
    <button class="mfilter-btn" id="mf-btn-acc" onclick="toggleMenu(event,'acc')">
      <span id="mf-label-acc">帳戶</span>
      <svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
    </button>
    <div class="mfilter-menu" id="mf-menu-acc"></div>
  </div>
  <div class="mfilter" data-kind="grp">
    <button class="mfilter-btn" id="mf-btn-grp" onclick="toggleMenu(event,'grp')">
      <span id="mf-label-grp">群組</span>
      <svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
    </button>
    <div class="mfilter-menu" id="mf-menu-grp"></div>
  </div>
  <div class="mfilter" data-kind="cat">
    <button class="mfilter-btn" id="mf-btn-cat" onclick="toggleMenu(event,'cat')">
      <span id="mf-label-cat">類別</span>
      <svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
    </button>
    <div class="mfilter-menu" id="mf-menu-cat"></div>
  </div>
</div>

<div class="time-filter-bar">
  <button class="time-btn" data-mode="month" onclick="setTimeFilter('month')">近月</button>
  <button class="time-btn" data-mode="year" onclick="setTimeFilter('year')">近年</button>
  <div class="win-nav" id="win-nav" style="display:none">
    <button class="win-btn" id="win-prev" onclick="shiftWindow(-1)" aria-label="較早">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <span class="win-label" id="win-label"></span>
    <button class="win-btn" id="win-next" onclick="shiftWindow(1)" aria-label="較晚">
      <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
  </div>
</div>

<div class="charts-grid">

  <!-- 收支趨勢 + 總資產趨勢線 -->
  <div class="card full">
    <div class="card-head">
      <h2 id="chart-title">收支趨勢</h2>
      <span class="scope" id="chart-scope"></span>
    </div>
    <div class="swipe-area" id="trend-swipe">
      <canvas id="trend-chart"></canvas>
    </div>
  </div>

  <!-- 主要收/支組成（依群組） -->
  <div class="card full">
    <div class="card-head">
      <h2 id="rank-title">主要收支</h2>
      <span class="scope" id="rank-scope"></span>
    </div>
    <div class="rank-grid" id="rank-container"></div>
  </div>

</div>

<script>
  window.CHART_DATA = {
    expenses: {{ expenses | tojson }},
    categories: {{ categories | tojson }},
    groups: {{ groups | tojson }},
    accounts: {{ accounts | tojson }},
    history: {{ history | tojson }}
  };
</script>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/chart_logic.js') }}"></script>
{% endblock %}
